<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Editar Cliente</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<main class="container">
    <section class="card">
        <header class="header">
            <h1>Editar Cliente</h1>
            <p>
                Alteração de cadastro
            </p>

        </header>

        <form
            method="POST"
            action="{{ url_for('editar', cliente_id=cliente[0]) }}"
        >
            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ cliente[1] }}"
                    required
                >

            </div>

            <div class="campo">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    value="{{ cliente[2] }}"
                    required
                >

            </div>


            <div class="campo">
                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="text"
                    id="telefone"
                    name="telefone"
                    value="{{ cliente[3] }}"
                    required
                >
            </div>

            <button type="submit">
                Salvar alterações
            </button>

        </form>

        <p style="margin-top: 20px; text-align: center;">

            <a href="{{ url_for('index') }}">
                Voltar
            </a>
        </p>

    </section>

</main>

</body>

</html>
